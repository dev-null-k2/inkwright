ext {
    // Capacitor 8 defaults to 24; Inkwright needs 26 (adaptive vector icons, VibrationEffect).
    // Rich haptic primitives are used on API 30+ and degrade gracefully below.
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    orgJsonVersion = '20240303'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    // Kotlin for the InkwrightNative plugin. 2.4 because LiteRT-LM 0.19 and ML Kit GenAI Prompt
    // beta5 ship Kotlin 2.4 metadata, which older compilers refuse to read (docs/ANDROID.md).
    kotlin_version = '2.4.21'
    kotlinxCoroutinesVersion = '1.11.0'
    // On-device handwriting recognition.
    mlkitDigitalInkVersion = '19.0.0'
    // On-device AI (docs/LOCAL_AI.md, "Android"): Gemini Nano through ML Kit GenAI (AICore), the
    // GenAI task APIs, and LiteRT-LM for open models on phones without AICore. Model files from
    // Hugging Face are pinned in ai/LiteRtModels.kt and need LiteRT-LM 0.19+ for their GPU path.
    mlkitGenAiPromptVersion = '1.0.0-beta5'
    mlkitGenAiTasksVersion = '1.0.0-beta1'
    litertLmVersion = '0.19.0'
    // Instant ink tip: front-buffered overlay (CanvasFrontBufferedRenderer, API 29+) and motion prediction.
    androidxGraphicsCoreVersion = '1.0.4'
    androidxMotionPredictionVersion = '1.0.0'
}
