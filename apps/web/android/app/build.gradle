apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Release signing. Put the upload-key settings in android/keystore.properties (git-ignored):
//   storeFile=/absolute/path/or/relative/to/android/inkstone-upload.jks
//   storePassword=...
//   keyAlias=inkstone
//   keyPassword=...
// Without it, release builds fall back to the debug key so they still install for testing
// (such builds are rejected by Google Play). See docs/ANDROID.md.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseKeystore = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    keystoreProperties.getProperty(it)?.trim()
}

android {
    namespace = "app.inkstone"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.inkstone"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties.getProperty('storeFile').trim())
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias').trim()
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
    implementation "com.google.mlkit:digital-ink-recognition:$mlkitDigitalInkVersion"
    implementation "com.google.mlkit:genai-prompt:$mlkitGenAiPromptVersion"
    implementation "com.google.mlkit:genai-summarization:$mlkitGenAiTasksVersion"
    implementation "com.google.mlkit:genai-proofreading:$mlkitGenAiTasksVersion"
    implementation "com.google.mlkit:genai-rewriting:$mlkitGenAiTasksVersion"
    implementation "com.google.mlkit:genai-image-description:$mlkitGenAiTasksVersion"
    implementation "com.google.ai.edge.litertlm:litertlm-android:$litertLmVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:$kotlinxCoroutinesVersion"
    implementation "androidx.graphics:graphics-core:$androidxGraphicsCoreVersion"
    implementation "androidx.input:input-motionprediction:$androidxMotionPredictionVersion"
    testImplementation "junit:junit:$junitVersion"
    // Real org.json for JVM tests (android.jar only has stubs): feel-golden.json fixtures, FeelProfile.fromJson.
    testImplementation "org.json:json:$orgJsonVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// Source maps are useful in debug builds (chrome://inspect) but only add weight to releases.
tasks.matching { it.name == 'mergeReleaseAssets' }.configureEach { task ->
    task.doLast {
        def out = task.outputDir.get().asFile
        project.fileTree(out) { include '**/*.map' }.each { it.delete() }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseKeystore && graph.allTasks.any { it.project == project && it.name ==~ /(assemble|bundle|package)Release/ }) {
        logger.warn("Inkstone: android/keystore.properties not found or incomplete — the release build is signed with the DEBUG key. Google Play will reject it; see docs/ANDROID.md.")
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
