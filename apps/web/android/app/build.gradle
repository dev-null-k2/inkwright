apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Release signing. Put the upload-key settings in android/keystore.properties (git-ignored):
//   storeFile=/absolute/path/or/relative/to/android/inkwright-upload.jks
//   storePassword=...
//   keyAlias=inkwright
//   keyPassword=...
// Without it, release builds fall back to the debug key so they still install for testing
// (such builds are rejected by Google Play). See docs/ANDROID.md.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseKeystore = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    keystoreProperties.getProperty(it)?.trim()
}

// ABIs (docs/PERFORMANCE.md, "Android"). 32-bit x86 is left out everywhere: no supported device
// runs it. The app bundle carries the rest and Google Play delivers one ABI per device, so they
// cost nothing in downloads; armeabi-v7a keeps 32-bit phones working (without LiteRT open models,
// which ship no 32-bit code), x86_64 is for Chromebooks and the emulator.
// (Not `ndk.abiFilters`: the Android Gradle plugin refuses those together with ABI splits, and
// splits do not apply to bundles. Packaging excludes, below, apply to APKs and bundles alike.)
def shippedAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']
def droppedAbis = ['x86', 'riscv64', 'mips', 'mips64', 'armeabi'] - shippedAbis
// APKs handed out directly are split per ABI for release (app-arm64-v8a-release.apk is the one
// phones need) instead of one APK carrying all three. Splits only apply to APKs, never to bundles.
def requested = gradle.startParameter.taskNames
def releaseApks = requested.any { it ==~ /(?i)(.*:)?(assemble|package)Release/ }
// With resource shrinking, the plugin cannot build a bundle in the same invocation as split APKs
// (https://issuetracker.google.com/402800800): it fails late with "Multiple shrunk-resources files".
// Say so up front instead; separate invocations work in either order (.github/workflows/release.yml).
if (releaseApks && requested.any { it ==~ /(?i)(.*:)?bundleRelease/ }) {
    throw new GradleException("Inkwright: run bundleRelease and assembleRelease as two Gradle invocations (release APKs are split per ABI, which the Android Gradle plugin cannot combine with a shrunk bundle in one build). See docs/ANDROID.md.")
}
// ABI splits apply to every variant built in the same invocation, which would split the debug APK
// too (and leave all but arm64-v8a without native code, see debugAbis). Same remedy.
if (releaseApks && requested.any { it ==~ /(?i)(.*:)?(assemble|package|install)Debug/ }) {
    throw new GradleException("Inkwright: run assembleDebug and assembleRelease as two Gradle invocations (release APKs are split per ABI, and the split would apply to the debug APK too). See docs/ANDROID.md.")
}
// Debug APKs are installed by hand on a phone: arm64-v8a only. The emulator suite adds its own
// ABI (scripts/android/build-apk.sh passes -Pinkwright.debugAbis=arm64-v8a,x86_64).
def debugAbis = ((project.findProperty('inkwright.debugAbis') ?: 'arm64-v8a') as String).split(',')*.trim()

android {
    namespace = "app.inkwright"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.inkwright"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties.getProperty('storeFile').trim())
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias').trim()
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // R8: shrinks, optimizes and obfuscates the Kotlin/Java code, and drops resources
            // nothing references. Keep rules for reflection and JNI are in proguard-rules.pro;
            // libraries bring their own (Capacitor, ML Kit, AndroidX). mapping.txt for crash
            // reports is in build/outputs/mapping/release/.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    splits {
        abi {
            enable releaseApks
            reset()
            include(*shippedAbis)
            universalApk false
        }
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// Every build leaves out `droppedAbis`; debug APKs carry only `debugAbis` (above): the x86_64
// libraries alone were 36 MB of the old universal debug APK, and no phone uses them.
androidComponents {
    onVariants(selector().all()) { variant ->
        def excluded = droppedAbis + (variant.buildType == 'debug' ? shippedAbis - debugAbis : [])
        excluded.each { abi -> variant.packaging.jniLibs.excludes.add("lib/${abi}/**") }
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
    implementation "com.google.mlkit:digital-ink-recognition:$mlkitDigitalInkVersion"
    implementation "com.google.mlkit:genai-prompt:$mlkitGenAiPromptVersion"
    implementation "com.google.mlkit:genai-summarization:$mlkitGenAiTasksVersion"
    implementation "com.google.mlkit:genai-proofreading:$mlkitGenAiTasksVersion"
    implementation "com.google.mlkit:genai-rewriting:$mlkitGenAiTasksVersion"
    implementation "com.google.mlkit:genai-image-description:$mlkitGenAiTasksVersion"
    implementation "com.google.ai.edge.litertlm:litertlm-android:$litertLmVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:$kotlinxCoroutinesVersion"
    implementation "androidx.graphics:graphics-core:$androidxGraphicsCoreVersion"
    implementation "androidx.input:input-motionprediction:$androidxMotionPredictionVersion"
    testImplementation "junit:junit:$junitVersion"
    // Real org.json for JVM tests (android.jar only has stubs): feel-golden.json fixtures, FeelProfile.fromJson.
    testImplementation "org.json:json:$orgJsonVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// Source maps are useful in debug builds (chrome://inspect) but only add weight to releases.
tasks.matching { it.name == 'mergeReleaseAssets' }.configureEach { task ->
    task.doLast {
        def out = task.outputDir.get().asFile
        project.fileTree(out) { include '**/*.map' }.each { it.delete() }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseKeystore && graph.allTasks.any { it.project == project && it.name ==~ /(assemble|bundle|package)Release/ }) {
        logger.warn("Inkwright: android/keystore.properties not found or incomplete — the release build is signed with the DEBUG key. Google Play will reject it; see docs/ANDROID.md.")
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
