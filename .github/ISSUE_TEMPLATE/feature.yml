name: Idea
description: Something Inkwright should do
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The moment it would help
      description: What you were doing, and where the app got in the way.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Writing and pens, Paper and pages, Organising and search, AI and agents, Sync and files, Android, iPhone and iPad, Desktop, Developers and API, Something else]
