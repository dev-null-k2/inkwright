# Builds the iOS app for devices when a version tag is pushed and uploads it to App Store Connect,
# where it appears in TestFlight (and can be submitted to the App Store). Signing is Xcode's
# automatic, cloud-managed signing driven by an App Store Connect API key, so there are no
# certificates or provisioning profiles to keep in secrets.
#
# Needs the Apple Developer Program and four repository secrets (docs/IOS.md, "Publishing"):
#   APPLE_TEAM_ID         the 10-character team ID (developer.apple.com › Membership)
#   ASC_KEY_ID            App Store Connect › Users and Access › Integrations › key ID
#   ASC_ISSUER_ID         the issuer ID shown above the keys
#   ASC_KEY_P8_BASE64     the downloaded AuthKey_<id>.p8, base64-encoded (Admin role)
# Without them the job only says so in its summary and succeeds, so tags still release Android,
# web and desktop as before.
#
# Same hardening as release.yml: pinned actions, read-only token, no persisted git credentials,
# tag-derived values passed as environment variables, the key deleted after use even on failure.
name: iOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  testflight:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Publishing set up?
        id: ready
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -n "$TEAM" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "iOS publishing isn't set up (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64); nothing was uploaded. See docs/IOS.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.ok == 'true'
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ready.outputs.ok == 'true'
        with: { node-version: 22, cache: npm }
      - name: Newest Xcode (26 or later compiles Apple's on-device model)
        if: steps.ready.outputs.ok == 'true'
        run: |
          x=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version

      - name: Version from tag
        if: steps.ready.outputs.ok == 'true'
        id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then echo "Not a version tag: $GITHUB_REF_NAME" >&2; exit 1; fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          # iOS shows MAJOR.MINOR.PATCH; the build number is the same code Android uses, so every
          # beta uploads with a higher build than the one before (docs/UPDATES.md, "Version codes").
          echo "marketing=${tag%%-*}" >> "$GITHUB_OUTPUT"
          build="$(node apps/web/scripts/release/version-code.mjs "$tag")"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
        env: { ONNXRUNTIME_NODE_INSTALL: skip }
      - name: Web build for the native shells
        if: steps.ready.outputs.ok == 'true'
        working-directory: apps/web
        env:
          INKWRIGHT_VERSION: ${{ steps.v.outputs.version }}
        run: |
          npx vite build --mode native
          npx cap sync ios

      - name: Archive, sign and upload to App Store Connect
        if: steps.ready.outputs.ok == 'true'
        working-directory: apps/web/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MARKETING: ${{ steps.v.outputs.marketing }}
          BUILD: ${{ steps.v.outputs.build }}
        run: |
          set -eo pipefail
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEY" | base64 --decode > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Inkwright.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING" CURRENT_PROJECT_VERSION="$BUILD" \
            "${auth[@]}" | tail -40
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Inkwright.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}" | tail -40
          echo "Uploaded Inkwright $MARKETING ($BUILD) to App Store Connect; it shows in TestFlight once Apple finishes processing it." >> "$GITHUB_STEP_SUMMARY"
