# Builds a release when a version tag is pushed (git tag v1.2.0 && git push --tags):
#   - Android: a signed APK for sideloading and an AAB for Google Play
#   - Web: the single-file offline build (open it from disk, no server)
#   - Source zip
# and attaches them to a GitHub release with notes from CHANGELOG.md.
#
# Signing uses repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (see docs/PUBLISHING.md). Without them the APK is
# signed with a throwaway debug key: it installs, but Google Play will not accept it.
#
# Supply-chain hardening (docs/SECURITY_REVIEW.md, SR-09):
# - every action is pinned to a commit SHA (the comment names the version);
# - the build job, which runs npm install scripts, Vite and Gradle, has a read-only token and no
#   persisted git credentials; only the publish job, which runs no project code, may write;
# - values derived from the tag reach shell scripts as environment variables, never as ${{ }}
#   text pasted into the script;
# - the keystore is decoded only for the Android step and deleted right after it, even on failure.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: npm ci
      - run: npm run typecheck && npm test

      - name: Version from tag
        id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Only plain versions (1.2.3 or 1.2.3-beta.1) go further: the value ends up in file names
          # and in build.gradle.
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then tag="0.0.0"; fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          # versionCode: major*10000 + minor*100 + patch
          IFS=. read -r a b c <<< "${tag%%-*}"
          echo "code=$(( ${a:-0}*10000 + ${b:-0}*100 + ${c:-0} ))" >> "$GITHUB_OUTPUT"

      - name: Android
        working-directory: apps/web
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CODE: ${{ steps.v.outputs.code }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx vite build --mode native
          npx cap sync android
          cd android
          if [ -n "$KEYSTORE" ]; then
            umask 077
            echo "$KEYSTORE" | base64 -d > upload.jks
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PW" "$ALIAS" "$KEY_PW" > keystore.properties
          fi
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" app/build.gradle
          ./gradlew testDebugUnitTest assembleRelease bundleRelease
          mkdir -p ../../../out
          cp app/build/outputs/apk/release/*.apk "../../../out/Inkwright-$VERSION.apk"
          cp app/build/outputs/bundle/release/*.aab "../../../out/Inkwright-$VERSION.aab"

      - name: Remove the signing key
        if: always()
        working-directory: apps/web/android
        run: rm -f upload.jks keystore.properties

      - name: Web (single file)
        env: { VERSION: '${{ steps.v.outputs.version }}' }
        run: |
          npm run build:single -w @inkwright/web
          cp apps/web/dist-single/index.html "out/Inkwright-$VERSION.html"

      - name: Source
        env: { VERSION: '${{ steps.v.outputs.version }}' }
        run: git archive -o "out/Inkwright-$VERSION-source.zip" --prefix=inkwright/ HEAD

      - name: Release notes
        env: { VERSION: '${{ steps.v.outputs.version }}' }
        run: |
          awk -v v="$VERSION" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > out/notes.md
          [ -s out/notes.md ] || echo "See CHANGELOG.md." > out/notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: release, path: out/, if-no-files-found: error }

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release, path: out }
      - run: mv out/notes.md notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          files: out/*
          prerelease: ${{ contains(github.ref_name, '-') }}
