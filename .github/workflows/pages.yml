# Publishes the web app to GitHub Pages on every push to main. Inkwright needs no server: the page is
# static files, notes live on each device (and in the user's own Google Drive / WebDAV / folder),
# and AI runs on the device or against the user's own provider. See docs/HOSTING.md.
name: Publish site and web app
on:
  push:
    branches: [main]
  workflow_dispatch:
# Least privilege: only the deploy job (which runs no project code) can publish.
permissions:
  contents: read
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # The landing page at the root, the app under /app/, README art and screenshots under /media/.
      - run: |
          node scripts/brand/privacy-page.mjs
          mkdir -p _site
          cp -r site/. _site/
          cp -r docs/media _site/media
          cp -r apps/web/dist _site/app
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
