# Publishes the web app to GitHub Pages on every push to main. Inkstone needs no server: the page is
# static files, notes live on each device (and in the user's own Google Drive / WebDAV / folder),
# and AI runs on the device or against the user's own provider. See docs/HOSTING.md.
name: Publish site and web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # The landing page at the root, the app under /app/, README art and screenshots under /media/.
      - run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r docs/media _site/media
          cp -r apps/web/dist _site/app
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
