# Publishes the web app to GitHub Pages on every push to main. Inkwright needs no server: the page is
# static files, notes live on each device (and in the user's own Google Drive / WebDAV / folder),
# and AI runs on the device or against the user's own provider. See docs/HOSTING.md.
name: Publish site and web app
on:
  push:
    branches: [main]
  workflow_dispatch:
# Least privilege: only the deploy job (which runs no project code) can publish.
permissions:
  contents: read
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # The landing page at the root, the app under /app/, README art and screenshots under /media/.
      - run: |
          node scripts/brand/privacy-page.mjs
          mkdir -p _site
          cp -r site/. _site/
          cp -r docs/media _site/media
          cp -r apps/web/dist _site/app
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
