# Typecheck, unit tests + evals, end-to-end tests and the startup performance budget on every push
# and pull request.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
      # Startup budget (docs/PERFORMANCE.md): initial JS/CSS bytes and cold-start timings of the
      # production build at 4x CPU slowdown must stay within apps/web/perf/budget.json.
      - run: npm run build
      - run: npm run perf:bundle -w @inkwright/web
      - run: npm run perf:budget -w @inkwright/web
