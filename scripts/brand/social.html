<!doctype html>
<!-- The GitHub social preview (1280×640). Rendered to docs/media/social.png by scripts/brand/social.mjs. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@500&family=Hanken+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden }
  body { background: #e8e5ea; font-family: 'Hanken Grotesk', sans-serif; color: #2b2330; display: grid; grid-template-columns: 560px 1fr; align-items: center }
  .left { padding: 0 0 0 72px }
  .left img { width: 470px; display: block; margin-left: -28px }
  h1 { font: 500 34px/1.2 'Brygada 1918', Georgia, serif; margin: 18px 0 18px; letter-spacing: -0.01em }
  .facts { display: flex; gap: 18px; font-size: 18px; color: #5f5666 }
  .facts span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5e9c7e; margin-right: 9px; vertical-align: middle }
  .sheet { background: #fffdf7; padding: 14px; border-radius: 4px; transform: rotate(1.4deg) translateX(10px); box-shadow: 0 1px 2px rgba(43,30,50,.08), 0 30px 60px -30px rgba(43,30,50,.5); width: 700px }
  .sheet img { width: 100%; display: block }
</style></head>
<body>
  <div class="left">
    <img src="../../docs/media/hero-static-light.svg" alt="">
    <h1>Handwriting that feels like paper.<br>An agent that answers in ink.</h1>
    <div class="facts"><span>Open source</span><span>Local-first</span><span>Any AI</span></div>
  </div>
  <div class="sheet"><img src="../../docs/media/screens/ask.png" alt=""></div>
</body></html>
