# Inkwright appliance: the web app, plus the server's MCP/A2A endpoints and the WebDAV vault on one
# origin. TLS is terminated in front of this (your load balancer or ingress); see docs/ENTERPRISE.md.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 64m;

  # The app talks only to this origin: no third-party scripts, frames or connections.
  # (Add your identity provider's origin to connect-src if users sign in to the MCP server from the app.)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
  add_header Cross-Origin-Opener-Policy same-origin always;

  location = /healthz { access_log off; default_type application/json; return 200 '{"ok":true}'; }

  # The administrator's AI policy: never cached, so changes apply on the next app start.
  location = /managed-policy.json { add_header Cache-Control "no-store" always; try_files $uri =404; }

  # MCP, A2A and their discovery documents go to the server (auth is checked there).
  location ~ ^/(mcp|a2a)$ {
    proxy_pass http://server:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;              # Streamable HTTP / SSE
    proxy_read_timeout 1h;
  }
  location ^~ /.well-known/ {
    proxy_pass http://server:8765;
    proxy_set_header Host $host;
  }

  # The vault over WebDAV, for the app's sync (Settings › Sync › WebDAV: https://<host>/dav/).
  location ^~ /dav/ {
    proxy_pass http://webdav:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_request_buffering off;
  }

  # The single-page app: hashed assets cached long, everything else falls back to index.html.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
