# Inkstone appliance (docs/ENTERPRISE.md): the web app, the MCP/A2A server with the routine
# runner, a WebDAV endpoint for the vault, and optionally Ollama — with no outbound internet.
#
#   cp deploy/.env.example deploy/.env    # then edit it
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile ollama up -d
#
# Networks: only `web` is on `edge` (the published port). `server`, `webdav` and `ollama` are on
# `internal`, which Docker creates without a route out, so nothing in them can reach the internet
# (or your LAN) even if it tried. To use a cloud AI provider, see "Allowing one provider" in
# docs/ENTERPRISE.md — it is an explicit, reviewed change, never the default.

name: inkstone

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

services:
  web:
    <<: *hardening
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    image: ${INKSTONE_IMAGE_PREFIX:-inkstone}/web:${INKSTONE_VERSION:-local}
    ports: ["${INKSTONE_BIND:-127.0.0.1}:${INKSTONE_PORT:-8080}:8080"]
    networks: [edge, internal]
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    volumes:
      - ${INKSTONE_MANAGED_POLICY:-./managed-policy.default.json}:/usr/share/nginx/html/managed-policy.json:ro
    depends_on:
      server: { condition: service_healthy }
      webdav: { condition: service_started }

  server:
    <<: *hardening
    build: { context: .., dockerfile: deploy/Dockerfile, target: server }
    image: ${INKSTONE_IMAGE_PREFIX:-inkstone}/server:${INKSTONE_VERSION:-local}
    networks: [internal]
    tmpfs: [/tmp]
    volumes:
      - vault:/vault
      - ${INKSTONE_MANAGED_POLICY:-./managed-policy.default.json}:/etc/inkstone/policy.json:ro
    environment:
      INKSTONE_PUBLIC_URL: ${INKSTONE_PUBLIC_URL:?set INKSTONE_PUBLIC_URL, e.g. https://notes.example.com}
      INKSTONE_POLICY_FILE: /etc/inkstone/policy.json
      # A P-256 private JWK that signs the audit trail (add it as a secret: docs/ENTERPRISE.md).
      INKSTONE_AUDIT_KEY: ${INKSTONE_AUDIT_KEY_PATH:-}
      INKSTONE_A2A: ${INKSTONE_A2A:-1}
      # Sign-in: OAuth 2.1 with your OpenID Connect provider (recommended) or a bearer token.
      INKSTONE_OAUTH_ISSUER: ${INKSTONE_OAUTH_ISSUER:-}
      INKSTONE_OAUTH_AUDIENCE: ${INKSTONE_OAUTH_AUDIENCE:-}
      INKSTONE_OAUTH_JWKS_URL: ${INKSTONE_OAUTH_JWKS_URL:-}
      INKSTONE_MCP_TOKEN: ${INKSTONE_MCP_TOKEN:-}
      # The server's own AI (summaries, routines, A2A). Default: Ollama inside the appliance.
      INKSTONE_AI_PROVIDER: ${INKSTONE_AI_PROVIDER:-ollama}
      INKSTONE_AI_MODEL: ${INKSTONE_AI_MODEL:-qwen2.5:7b-instruct}
      INKSTONE_AI_BASE_URL: ${INKSTONE_AI_BASE_URL:-http://ollama:11434/v1}
      INKSTONE_AI_ON_PREMISES: ${INKSTONE_AI_ON_PREMISES:-1}

  webdav:
    <<: *hardening
    image: rclone/rclone:1.68
    user: "65532:65532"   # the server's user, so both can write the vault
    networks: [internal]
    tmpfs: [/tmp, /config]
    volumes: [vault:/vault]
    command: ["serve", "webdav", "/vault", "--addr", ":8080", "--htpasswd", "/run/secrets/webdav.htpasswd", "--realm", "Inkstone"]
    secrets: [webdav.htpasswd]

  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.5.7
    networks: [internal]
    # Models are loaded into this volume ahead of time (no egress); see docs/ENTERPRISE.md.
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    healthcheck: { test: ["CMD", "ollama", "list"], interval: 30s, timeout: 5s, retries: 3 }

networks:
  edge: {}
  internal:
    internal: true

volumes:
  vault: {}
  ollama: {}

secrets:
  webdav.htpasswd:
    file: ${INKSTONE_WEBDAV_HTPASSWD:-./webdav.htpasswd}
